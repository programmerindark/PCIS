[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcis"
version = "0.1.0.dev0"
description = "Poultry Climate Intelligence System - engineering decision-support system for environmentally controlled broiler houses"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "SQLAlchemy>=2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
charts = ["plotly>=5.20"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pypdf>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["pcis*"]
